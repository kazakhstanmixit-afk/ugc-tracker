<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC Трекер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }
  .header { background: #111; border-bottom: 1px solid #222; padding: 20px 40px; display: flex; align-items: center; gap: 20px; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .header span { color: #888; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 40px; }
  .stat-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 28px; }
  .stat-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .stat-value { font-size: 36px; font-weight: 700; }
  .stat-sub { color: #555; font-size: 12px; margin-top: 8px; }
  .filters { padding: 0 40px 20px; display: flex; gap: 12px; align-items: center; }
  .search { background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px 16px; color: #fff; font-size: 14px; width: 300px; outline: none; }
  .search:focus { border-color: #444; }
  .filter-btn { background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px 20px; color: #888; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
  .table-wrap { padding: 0 40px 40px; }
  table { width: 100%; border-collapse: collapse; background: #111; border-radius: 16px; overflow: hidden; }
  th { background: #161616; color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 16px 20px; text-align: left; border-bottom: 1px solid #222; cursor: pointer; }
  th:hover { color: #888; }
  td { padding: 16px 20px; border-bottom: 1px solid #161616; font-size: 14px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #161616; }
  .rank { color: #555; font-weight: 600; width: 40px; }
  .username { font-weight: 600; }
  .username span { display: block; color: #555; font-size: 12px; font-weight: 400; margin-top: 2px; }
  .platform-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; }
  .tt { background: #1a1a2e; color: #7b8cde; }
  .ig { background: #2a1a2e; color: #de7bc0; }
  .num { font-weight: 600; }
  .er { color: #4ade80; font-weight: 600; }
  .empty { text-align: center; padding: 60px; color: #555; }
  .loading { text-align: center; padding: 60px; color: #555; }
  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); padding: 20px; }
    .filters { padding: 0 20px 20px; flex-wrap: wrap; }
    .table-wrap { padding: 0 20px 20px; }
    .header { padding: 20px; }
    .search { width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>UGC Трекер</h1>
  <span id="updated">Обновление данных...</span>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Всего видео</div>
    <div class="stat-value" id="total-videos">—</div>
    <div class="stat-sub">заявок</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Участников</div>
    <div class="stat-value" id="total-participants">—</div>
    <div class="stat-sub">уникальных</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Просмотры</div>
    <div class="stat-value" id="total-views">—</div>
    <div class="stat-sub">суммарно</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Лайки</div>
    <div class="stat-value" id="total-likes">—</div>
    <div class="stat-sub">суммарно</div>
  </div>
</div>

<div class="filters">
  <input class="search" type="text" placeholder="Поиск по нику..." id="search" oninput="filterTable()">
  <button class="filter-btn active" onclick="filterPlatform('all', this)">Все</button>
  <button class="filter-btn" onclick="filterPlatform('instagram', this)">Instagram</button>
  <button class="filter-btn" onclick="filterPlatform('tiktok', this)">TikTok</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>№</th>
        <th>Участник</th>
        <th>Платформы</th>
        <th onclick="sortBy('videos')">Видео ↕</th>
        <th onclick="sortBy('views')">Просмотры ↕</th>
        <th onclick="sortBy('likes')">Лайки ↕</th>
        <th onclick="sortBy('er')">ER% ↕</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="7" class="loading">Загрузка данных...</td></tr>
    </tbody>
  </table>
</div>

<script>
const SUPABASE_URL = 'https://ksiaspxcewpskhtzudrg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_O5BdaXtaa2NYj1t9IxYs1Q_w7WjKrFv';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allData = [];
let currentPlatform = 'all';
let sortField = 'views';
let sortDir = -1;

function formatNum(n) {
  if (n >= 1000000000) return (n/1000000000).toFixed(1) + 'B';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n;
}

async function loadData() {
  const { data: participants } = await supabase.from('participants').select('*');
  const { data: videos } = await supabase.from('videos').select('*');

  if (!participants || !videos) {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty">Нет данных. Добавьте участников.</td></tr>';
    return;
  }

  allData = participants.map(p => {
    const pvids = videos.filter(v => v.participant_id === p.id);
    const igVids = pvids.filter(v => v.platform === 'instagram');
    const ttVids = pvids.filter(v => v.platform === 'tiktok');
    const totalViews = pvids.reduce((s, v) => s + (v.views || 0), 0);
    const totalLikes = pvids.reduce((s, v) => s + (v.likes || 0), 0);
    const er = totalViews > 0 ? ((totalLikes / totalViews) * 100).toFixed(1) : 0;
    return { ...p, videos: pvids.length, igCount: igVids.length, ttCount: ttVids.length, views: totalViews, likes: totalLikes, er: parseFloat(er) };
  });

  updateStats();
  renderTable();
  document.getElementById('updated').textContent = 'Обновлено: ' + new Date().toLocaleString('ru');
}

function updateStats() {
  const totalVideos = allData.reduce((s, p) => s + p.videos, 0);
  const totalViews = allData.reduce((s, p) => s + p.views, 0);
  const totalLikes = allData.reduce((s, p) => s + p.likes, 0);
  document.getElementById('total-videos').textContent = formatNum(totalVideos);
  document.getElementById('total-participants').textContent = allData.length;
  document.getElementById('total-views').textContent = formatNum(totalViews);
  document.getElementById('total-likes').textContent = formatNum(totalLikes);
}

function renderTable() {
  const search = document.getElementById('search').value.toLowerCase();
  let filtered = allData.filter(p => {
    const matchSearch = p.username.toLowerCase().includes(search);
    const matchPlatform = currentPlatform === 'all' ||
      (currentPlatform === 'instagram' && p.igCount > 0) ||
      (currentPlatform === 'tiktok' && p.ttCount > 0);
    return matchSearch && matchPlatform;
  });

  filtered.sort((a, b) => sortDir * (b[sortField] - a[sortField]));

  if (filtered.length === 0) {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty">Участники не найдены</td></tr>';
    return;
  }

  document.getElementById('table-body').innerHTML = filtered.map((p, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td class="username">@${p.username}<span>${p.instagram_handle || p.tiktok_handle || ''}</span></td>
      <td>
        ${p.igCount > 0 ? `<span class="platform-badge ig">IG ${p.igCount}</span>` : ''}
        ${p.ttCount > 0 ? `<span class="platform-badge tt">TT ${p.ttCount}</span>` : ''}
      </td>
      <td class="num">${p.videos}</td>
      <td class="num">${formatNum(p.views)}</td>
      <td class="num">${formatNum(p.likes)}</td>
      <td class="er">${p.er}%</td>
    </tr>
  `).join('');
}

function filterTable() { renderTable(); }
function filterPlatform(platform, btn) {
  currentPlatform = platform;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}
function sortBy(field) {
  if (sortField === field) sortDir *= -1;
  sortField = field;
  renderTable();
}

loadData();
setInterval(loadData, 300000);
</script>
</body>
</html>
